name: "Publish Release"

on:
  push:
    # Workflow ini akan berjalan otomatis setiap kali kamu membuat tag baru (misal: v1.0.0)
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Kita ubah argumen Mac agar memerintahkan tauri-build merakit versi universal
          - platform: "macos-latest"
            args: "--target universal-apple-darwin" 
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      # 👇 PERBAIKAN DI SEKSI RUST INI 👇
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin, x86_64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Tamtek Downloader ${{ github.ref_name }}"
          releaseBody: "Rilis otomatis dari GitHub Actions."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}